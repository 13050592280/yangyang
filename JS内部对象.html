<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS内部对象</title>
</head>
<body>
    <script>
        // math对象
        console.log(Math.floor(8.7));    //向下取整
        console.log(Math.round(8.7));    //四舍五入
        console.log(Math.random());      //生成0到1之间的随机数[0,1)
        // 获取从min到max的随机数
        function getRandomNum(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        console.log(getRandomNum(100,900));
        // date对象
        var date = new Date();
        console.log(date.getFullYear());   //获取当前年份
        console.log(date.getMonth()+1);    //获取当前月份，月份是从0开始的，所以要加1
        console.log(date.getDate());       //获取当前日期
        console.log(date.getHours());     //获取当前小时
        console.log(date.getMinutes());   //获取当前分钟
        console.log(date.getSeconds());   //获取当前秒
        console.log(date.getDay());         //获取当前星期几，星期是从0开始的，所以要加1
        console.log(date.getTime());      //获取当前时间戳
        console.log(date.toLocaleString()); //获取本地化的时间字符串
        console.log(date.toDateString());   //获取本地化日期字符串
        // 数组对象
        var arr = [1,2,3,4,'five','six','seven'];
        var arr2 = new Array(1,2,3,4,'five','six','seven');

        console.log(new Array(5)); //创建一个长度为5的数组，数组元素为undefined
        var arr2=Array.of(5);
        console.log(arr2); //创建一个长度为1的数组，数组元素为5
        

    </script>
</body>
</html>
