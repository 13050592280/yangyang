<!DOCTYPE html>
<!--
  作者：杨阳
  学号：24002120323
  建立时间：2026-11-26
  使用大模型：DeepSeek-V4.1-Flash
  功能名称：诗词卡片（上图下文）
-->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f2ea">
    <meta name="description" content="杨阳的《高级网页设计》练习：从本地 3004 端口读取诗词数据，渲染上图下文的卡片列表">
    <title>诗词卡片 · 上图下文</title>
    <style>
        :root {
            --yy_bg: #f6f2ea;
            --yy_paper: #fffdf9;
            --yy_ink: #221d17;
            --yy_muted: #87796a;
            --yy_accent: #9a5b3d;
            --yy_line: #e6dccb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 0, #f1e3cf 0, transparent 45%),
                radial-gradient(circle at 92% 18%, #efe8db 0, transparent 40%),
                var(--yy_bg);
            color: var(--yy_ink);
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .yy_page {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 48px 22px 60px;
        }

        .yy_header {
            margin-bottom: 30px;
        }

        .yy_eyebrow {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--yy_accent);
            border: 1px solid var(--yy_accent);
            border-radius: 999px;
            padding: 5px 14px;
            margin-bottom: 16px;
        }

        .yy_title {
            font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
            font-size: 38px;
            letter-spacing: 4px;
            line-height: 1.3;
        }

        .yy_subtitle {
            margin-top: 12px;
            max-width: 560px;
            font-size: 13.5px;
            line-height: 1.9;
            color: var(--yy_muted);
        }

        .yy_toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
        }

        .yy_search {
            flex: 1;
            min-width: 0;
            padding: 12px 18px;
            border: 1px solid var(--yy_line);
            border-radius: 999px;
            background: var(--yy_paper);
            color: var(--yy_ink);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .yy_search:focus {
            border-color: var(--yy_accent);
            box-shadow: 0 0 0 3px rgba(154, 91, 61, 0.12);
        }

        .yy_sort {
            padding: 12px 20px;
            border: 1px solid var(--yy_line);
            border-radius: 999px;
            background: var(--yy_paper);
            color: var(--yy_ink);
            font-family: inherit;
            font-size: 13.5px;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .yy_sort.yy_is_active {
            background: var(--yy_accent);
            border-color: var(--yy_accent);
            color: #fff;
        }

        .yy_authors {
            margin-bottom: 28px;
            padding: 18px 20px;
            background: rgba(255, 253, 249, 0.8);
            border: 1px solid var(--yy_line);
            border-radius: 16px;
        }

        .yy_authors_title {
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--yy_accent);
            margin-bottom: 12px;
        }

        .yy_authors_list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .yy_author {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #f3ebdd;
            border: 1px solid var(--yy_line);
            font-size: 13px;
            color: var(--yy_ink);
        }

        .yy_author_dynasty {
            font-style: normal;
            font-size: 12px;
            color: var(--yy_muted);
        }

        .yy_status {
            margin: 40px 0;
            padding: 22px 20px;
            border: 1px dashed var(--yy_line);
            border-radius: 16px;
            background: rgba(255, 253, 249, 0.7);
            font-size: 14px;
            color: var(--yy_muted);
            text-align: center;
        }

        .yy_status code {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            background: #2f2822;
            color: #f6f2ea;
            font-size: 12.5px;
            letter-spacing: 0.5px;
        }

        .yy_grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
        }

        /* 上图下文的卡片：图片在上，标题与正文在下 */
        .yy_card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--yy_paper);
            border: 1px solid var(--yy_line);
            border-radius: 20px;
            box-shadow: 0 20px 40px -32px rgba(74, 50, 30, 0.7);
            opacity: 0;
            transform: translateY(14px);
            animation: yy_rise 0.5s ease forwards;
            animation-delay: var(--yy_delay, 0ms);
        }

        @keyframes yy_rise {
            to { opacity: 1; transform: translateY(0); }
        }

        .yy_figure {
            position: relative;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: linear-gradient(140deg, #e9dcc8, #d8bda2 55%, #c9a585);
        }

        .yy_figure_img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .yy_card:hover .yy_figure_img {
            transform: scale(1.04);
        }

        .yy_figure_img.yy_is_broken {
            display: none;
        }

        .yy_body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px 22px 24px;
        }

        .yy_poem_title {
            font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .yy_poem_content {
            font-size: 14px;
            line-height: 2;
            color: var(--yy_muted);
        }

        .yy_footer {
            margin-top: 42px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--yy_muted);
        }

        @media (max-width: 640px) {
            .yy_page {
                padding: 34px 16px 48px;
            }

            .yy_title {
                font-size: 28px;
                letter-spacing: 3px;
            }

            .yy_grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="yy_page">
        <header class="yy_header">
            <span class="yy_eyebrow">POEMS · 上图下文</span>
            <h1 class="yy_title">诗里有画</h1>
            <p class="yy_subtitle">卡片与诗人数据来自本地 3004 端口的 /api/poems 与 /api/authors，用 Promise.all 同时取回。运行前先在 db 目录执行 node server.js。</p>
        </header>

        <div class="yy_toolbar">
            <input class="yy_search" id="yy_search" type="search" placeholder="搜索标题或诗句" aria-label="搜索诗词">
            <button class="yy_sort" id="yy_sort" type="button" aria-pressed="false">按标题长度排序</button>
        </div>

        <section class="yy_authors" id="yy_authors" hidden>
            <h2 class="yy_authors_title">诗人</h2>
            <div class="yy_authors_list" id="yy_authors_list"></div>
        </section>

        <div class="yy_status" id="yy_status">正在读取诗词数据…</div>
        <div class="yy_grid" id="yy_grid"></div>

        <footer class="yy_footer">数据来源：db/db.json · poems</footer>
    </div>

    <script>
        var yy_apiPoems = "http://localhost:3004/api/poems";
        var yy_apiAuthors = "http://localhost:3004/api/authors";
        var yy_grid = document.getElementById("yy_grid");
        var yy_status = document.getElementById("yy_status");
        var yy_authors = document.getElementById("yy_authors");
        var yy_authorsList = document.getElementById("yy_authors_list");
        var yy_search = document.getElementById("yy_search");
        var yy_sort = document.getElementById("yy_sort");
        var yy_allPoems = [];
        var yy_loaded = false;
        var yy_sortByLength = false;

        // 功能：图片加载失败时隐藏图片，露出卡片自带的渐变底色
        function yy_onImageError(yy_event) {
            yy_event.target.classList.add("yy_is_broken");
        }

        // 功能：把诗词数据渲染成上图下文的卡片列表
        function yy_render(yy_list) {
            var yy_fragment = document.createDocumentFragment();

            yy_list.forEach(function (yy_poem, yy_index) {
                var yy_card = document.createElement("article");
                yy_card.className = "yy_card";
                yy_card.style.setProperty("--yy_delay", (yy_index * 80) + "ms");

                var yy_figure = document.createElement("div");
                yy_figure.className = "yy_figure";

                var yy_img = document.createElement("img");
                yy_img.className = "yy_figure_img";
                // Gitee 图床有防盗链，去掉 Referer 才能稳定加载
                yy_img.referrerPolicy = "no-referrer";
                yy_img.src = yy_poem.pic;
                yy_img.alt = yy_poem.title + " 配图";
                yy_img.loading = "lazy";
                yy_img.addEventListener("error", yy_onImageError);
                yy_figure.appendChild(yy_img);

                var yy_body = document.createElement("div");
                yy_body.className = "yy_body";

                var yy_h2 = document.createElement("h2");
                yy_h2.className = "yy_poem_title";
                yy_h2.textContent = yy_poem.title;

                var yy_p = document.createElement("p");
                yy_p.className = "yy_poem_content";
                yy_p.textContent = yy_poem.content;

                yy_body.appendChild(yy_h2);
                yy_body.appendChild(yy_p);
                yy_card.appendChild(yy_figure);
                yy_card.appendChild(yy_body);
                yy_fragment.appendChild(yy_card);
            });

            yy_grid.innerHTML = "";
            yy_grid.appendChild(yy_fragment);
            yy_status.hidden = true;
        }

        // 功能：接口不可用时给出启动本地数据服务的提示
        function yy_showError() {
            yy_status.hidden = false;
            yy_status.innerHTML = "没有取到诗词数据，请先启动本地数据服务：<br><code>cd db &amp;&amp; node server.js</code>";
        }

        // 功能：请求 JSON 接口，状态异常时抛出错误
        function yy_fetchJson(yy_url) {
            return fetch(yy_url).then(function (yy_res) {
                if (!yy_res.ok) {
                    throw new Error("HTTP " + yy_res.status);
                }
                return yy_res.json();
            });
        }

        // 功能：把诗人列表渲染成标签
        function yy_renderAuthors(yy_list) {
            yy_authorsList.innerHTML = "";

            yy_list.forEach(function (yy_author) {
                var yy_chip = document.createElement("span");
                yy_chip.className = "yy_author";
                yy_chip.title = yy_author.intro;
                yy_chip.textContent = yy_author.name;

                var yy_dynasty = document.createElement("em");
                yy_dynasty.className = "yy_author_dynasty";
                yy_dynasty.textContent = yy_author.dynasty;
                yy_chip.appendChild(yy_dynasty);

                yy_authorsList.appendChild(yy_chip);
            });

            yy_authors.hidden = false;
        }

        // 功能：按关键字过滤并可选按标题长度排序，然后刷新卡片列表
        function yy_applyView() {
            if (!yy_loaded) {
                return;
            }

            var yy_keyword = yy_search.value.trim();
            var yy_list = yy_allPoems.filter(function (yy_poem) {
                return yy_poem.title.indexOf(yy_keyword) >= 0 || yy_poem.content.indexOf(yy_keyword) >= 0;
            });

            if (yy_sortByLength) {
                yy_list.sort(function (yy_a, yy_b) {
                    return yy_a.title.length - yy_b.title.length;
                });
            }

            if (!yy_list.length) {
                yy_grid.innerHTML = "";
                yy_status.hidden = false;
                yy_status.textContent = "没有匹配的诗词，换个关键字试试。";
                return;
            }

            yy_render(yy_list);
        }

        // 功能：切换“按标题长度排序”开关并刷新列表
        function yy_toggleSort() {
            yy_sortByLength = !yy_sortByLength;
            yy_sort.classList.toggle("yy_is_active", yy_sortByLength);
            yy_sort.setAttribute("aria-pressed", yy_sortByLength ? "true" : "false");
            yy_applyView();
        }

        // 功能：绑定搜索框输入与排序按钮事件
        function yy_bindToolbar() {
            yy_search.addEventListener("input", yy_applyView);
            yy_sort.addEventListener("click", yy_toggleSort);
        }

        // 功能：用 Promise.all 同时请求诗词与诗人两份数据
        function yy_loadData() {
            Promise.all([yy_fetchJson(yy_apiPoems), yy_fetchJson(yy_apiAuthors)])
                .then(function (yy_result) {
                    yy_allPoems = yy_result[0];
                    yy_loaded = true;
                    yy_renderAuthors(yy_result[1]);
                    yy_applyView();
                })
                .catch(function () {
                    yy_showError();
                });
        }

        yy_bindToolbar();
        yy_loadData();
    </script>
</body>

</html>
