<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex弹性布局复习</title>
    <link rel="stylesheet" href="./flex弹性布局复习.css">
</head>
<!-- h5语义标签header footer section nav，main，article，aside，figure，figcaption -->
<body>
    <header class="page-header">
        <h2>Flex弹性布局复习</h2>
    </header>
    <main class="page-main">
        <section class="case">
        <h2 class="case-title">案例一、导航布局</h2>
        <nav class="nav-bar">
            <a href="#" class="logo">MyWebsite</a>
            <!-- 快捷输入方式ul>ul*4'快速生成ul标签，ul标签下生成li标签，li标签下生成a标签-->
            <ul class="nav-list">
             <li><a href="#">首页</a></li>
             <li><a href="#">关于</a></li>
             <li><a href="#">服务</a></li>
             <li><a href="#">联系</a></li>   
                
        </nav>
        </section>
        <!-- 案例二、平均分成三个部分 -->
         <section class="case"> 
            <h2 class="case-title">案例二、平均分成三个部分</h2>
            <div class="three-columns">
                <div class="columns">第一列</div>
                <div class="columns">第二列</div>
                <div class="columns">第三列</div>
            </div>
         </section>\
         <!-- 案例三、响应式卡片网络 -->
        <section class="case"> 
            <h2 class="case-title">案例三、响应式卡片网络</h2>
            <div class="card-grid">
                <div class="card">卡片一</div>
                <div class="card">卡片二</div>
                <div class="card">卡片三</div>
                <div class="card">卡片四</div>
        </section>
         <!-- 案例四：侧边栏布局 -->
          <section class="case"> 
            <h2 class="case-title">案例四，侧边栏布局</h2>
            <div class="sidebar"> 
               <aside>侧边栏</aside>
               <div class="main-content">
                主要内容
               </div>
            </div>
         </section>
    </main>
        
</body>
</html>
