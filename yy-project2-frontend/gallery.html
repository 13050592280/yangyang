<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文列表 · yy CampusMart</title>
  <link rel="stylesheet" href="css/yy_index.css">
  <link rel="stylesheet" href="css/yy_gallery.css">
</head>
<body class="yy_body">
  <canvas id="yy_petal_canvas" class="yy_petal_canvas" aria-hidden="true"></canvas>
  <div class="yy_blob yy_blob_one" aria-hidden="true"></div>
  <div class="yy_blob yy_blob_two" aria-hidden="true"></div>
  <div class="yy_blob yy_blob_three" aria-hidden="true"></div>

  <div class="yy_shell">
    <header class="yy_topbar">
      <div class="yy_logo">
        <div class="yy_logo_mark">yy</div>
        <div>
          <div class="yy_logo_name">yy CampusMart</div>
          <div class="yy_logo_sub">校园二手集市 · 让闲置流转起来</div>
        </div>
      </div>
      <div class="yy_badges">
        <a class="yy_badge" href="index.html"><span class="yy_badge_value">← 返回首页</span></a>
      </div>
    </header>

    <section class="yy_hero yy_hero_inner">
      <span class="yy_hero_eyebrow">Gallery</span>
      <h1 class="yy_hero_title" data-yy-text="图文列表" data-yy-accent="图文列表">图文列表</h1>
      <p class="yy_hero_desc">上图下文的卡片网格，收集校园闲置里那些清新美好的小瞬间。</p>
    </section>

    <div class="yy_wave_divider" aria-hidden="true">
      <svg viewBox="0 0 1440 60" preserveAspectRatio="none">
        <path d="M0,30 C240,60 480,0 720,30 C960,60 1200,0 1440,30 L1440,60 L0,60 Z" fill="rgba(255,255,255,0.55)"></path>
      </svg>
    </div>

    <section class="yy_section">
      <div class="yy_api_bar">
        <span class="yy_api_label">后端接口</span>
        <a class="yy_api_link" id="yy_api_link" href="/api/gallery" target="_blank">/api/gallery</a>
        <span class="yy_api_method">GET</span>
        <span class="yy_api_count" id="yy_api_count">加载中...</span>
      </div>

      <div class="yy_section_head yy_section_head_spaced">
        <span class="yy_section_kicker">Picture Gallery</span>
        <h2>图文卡片</h2>
        <p>图片加载失败时自动显示占位色块</p>
      </div>

      <div class="yy_gallery_grid" id="yy_gallery_grid">
        <div class="yy_loading" id="yy_loading">正在加载图文数据...</div>
      </div>
      <div class="yy_error_tip" id="yy_error_tip" role="alert"></div>
    </section>

    <footer class="yy_footer">
      <div>© 2026 杨阳 · yy CampusMart 校园二手集市</div>
      <div>用原生三件套用心打造 <span class="yy_footer_heart">♥</span> 无任何第三方库 / 框架 / CDN</div>
    </footer>
  </div>

  <script src="js/yy_index.js"></script>
  <script src="js/yy_gallery.js"></script>
